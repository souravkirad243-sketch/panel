<style>
        body {
            background-color: #050505;
            background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .vault-card {
            background-color: #121212;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-input:focus {
            border-color: #00F3FF;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            outline: none;
        }
        .neon-btn {
            background-color: #39FF14;
            color: black;
            transition: all 0.3s ease;
        }
        .neon-btn:hover {
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.5);
        }
        .hud-icon {
            border: 1px solid rgba(0, 243, 255, 0.2);
            background: rgba(0, 243, 255, 0.05);
        }
    </style>
</head>
<body class="text-on-surface antialiased min-h-screen flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop">
<!-- Top AppBar - Suppressed per Shared Component Logic (Transactional Page) -->
<main class="w-full max-w-[480px] flex flex-col gap-lg">
<!-- Header Section -->
<div class="text-center space-y-sm">
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary-fixed-dim uppercase tracking-tighter">CARD//VAULT</h1>
<div class="inline-flex items-center gap-xs px-sm py-xs bg-error-container/20 border border-error/30 rounded-DEFAULT">
<span class="material-symbols-outlined text-[16px] text-error">warning</span>
<span class="font-label-caps text-label-caps text-error">RECOVERY MODE INITIALIZED</span>
</div>
</div>
<!-- Recovery Card -->
<div class="vault-card p-md md:p-lg flex flex-col gap-md rounded-lg relative overflow-hidden group">
<!-- Scanline effect -->
<div class="absolute inset-0 pointer-events-none bg-[linear-gradient(transparent_50%,rgba(0,0,0,0.25)_50%)] bg-[length:100%_4px] opacity-20"></div>
<div class="relative z-10 flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Step 1: Identity Verification</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your registered identity token to receive a secure access link.</p>
</div>
<form class="relative z-10 flex flex-col gap-lg mt-sm">
<!-- Input Group -->
<div class="flex flex-col gap-xs">
<label class="font-technical-sm text-technical-sm text-secondary-fixed" for="identity_id">IDENTITY_ID</label>
<div class="relative flex items-center">
<div class="absolute left-0 pl-sm flex items-center pointer-events-none">
<div class="hud-icon w-8 h-8 flex items-center justify-center rounded-DEFAULT">
<span class="material-symbols-outlined text-[18px] text-secondary-fixed">fingerprint</span>
</div>
</div>
<input class="w-full bg-surface-container-lowest border-b border-outline-variant py-sm pl-[60px] pr-sm font-technical-sm text-technical-sm text-on-surface placeholder:text-on-surface-variant/40 neon-input transition-all rounded-none" id="identity_id" placeholder="&gt; Enter Email Address..." required="" type="email"/>
</div>
</div>
<!-- Action Area -->
<button class="neon-btn font-label-caps text-label-caps py-sm px-md w-full rounded-DEFAULT flex justify-center items-center gap-xs mt-sm" type="submit">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">send</span>
                    SEND RECOVERY LINK
                </button>
</form>
<!-- Terminal Output Area (Hidden by default, shown on error/success) -->
<div class="relative z-10 mt-md p-sm bg-surface-container-lowest border border-outline-variant font-technical-sm text-technical-sm rounded-DEFAULT">
<div class="flex items-center gap-xs text-on-surface-variant mb-xs">
<span class="w-2 h-2 rounded-full bg-surface-variant animate-pulse"></span>
<span>TERMINAL_OUTPUT</span>
</div>
<div class="text-on-surface opacity-60">
                    &gt; Awaiting identity verification...<br/>
                    &gt; ...
                </div>
</div>
</div>
<!-- Back to Login (Ghost Button) -->
<div class="text-center">
<a class="inline-flex items-center gap-xs font-technical-sm text-technical-sm text-on-surface-variant hover:text-secondary-fixed transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                &gt; RETURN_TO_LOGIN
            </a>
</div>
</main>
<!-- Footer - Suppressed per Shared Component Logic (Transactional Page) -->
</body></html>
