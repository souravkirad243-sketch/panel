<style>

<script>
        // Simple password strength logic for visual feedback
        function updateStrength(value) {
            const segments = [
                document.getElementById('s1'),
                document.getElementById('s2'),
                document.getElementById('s3'),
                document.getElementById('s4')
            ];
            const label = document.getElementById('entropy-label');
            
            let strength = 0;
            if (value.length > 5) strength++;
            if (value.length > 8) strength++;
            if (/[A-Z]/.test(value) && /[0-9]/.test(value)) strength++;
            if (/[^A-Za-z0-9]/.test(value)) strength++;

            // Reset
            segments.forEach(seg => seg.style.backgroundColor = 'transparent');
            
            const colors = ['#ffb4ab', '#dab9ff', '#00f1fd', '#39ff14'];
            const labels = ['WEAK', 'MODERATE', 'OPTIMAL', 'MAXIMUM'];

            for (let i = 0; i < strength; i++) {
                segments[i].style.backgroundColor = colors[strength - 1];
            }

            label.textContent = strength > 0 ? labels[strength - 1] : 'INSUFFICIENT';
            label.style.color = strength > 0 ? colors[strength - 1] : '#3c4b35';
        }
    </script>
