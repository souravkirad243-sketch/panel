<style>
        body {
            background-color: #050505;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #e5e2e1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 243, 255, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100vh);
            }
            100% {
                transform: translateY(100vh);
            }
        }

        .vault-card {
            background-color: #121212;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(20px);
            position: relative;
        }
        
        .vault-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid rgba(0, 243, 255, 0.1);
            pointer-events: none;
        }

        .input-tech {
            background-color: #0a0a0a;
            border: none;
            border-bottom: 1px solid #3c4b35;
            color: #e5e2e1;
            transition: all 0.2s ease;
        }

        .input-tech:focus {
            outline: none;
            border-bottom-color: #00F3FF;
            box-shadow: 0 1px 15px rgba(0, 243, 255, 0.2);
        }

        .input-tech::placeholder {
            color: rgba(229, 226, 225, 0.4);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .btn-primary {
            background-color: #39FF14;
            color: #000;
            border: none;
            text-transform: uppercase;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
            transform: translateY(-1px);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(rgba(255,255,255,0.2), transparent, rgba(255,255,255,0.2));
            transform: rotate(45deg);
            animation: glitch-anim 4s infinite linear;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .btn-primary:hover::after {
            opacity: 1;
        }

        @keyframes glitch-anim {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .hud-icon {
            border: 1px solid rgba(0, 243, 255, 0.2);
            color: #00F3FF;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: rgba(0, 243, 255, 0.05);
        }
      </style>

<body class="font-body-md text-body-md text-on-background w-full h-full p-4 md:p-0 relative">

<div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-secondary-fixed opacity-50"></div>

</div>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center justify-between" for="email">
<span>&gt; IDENTITY_ID</span>
</label>
<div class="relative">
<input autocomplete="email" class="input-tech w-full py-sm pl-sm pr-10 font-technical-sm text-technical-sm" id="email" placeholder="Enter operator email..." required="" type="email"/>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-secondary-container opacity-50 pointer-events-none" style="font-size: 16px;">badge</span>

<!-- Password Field -->

<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center justify-between" for="password">
<span>&gt; PASSKEY</span>
<a class="text-secondary-fixed hover:text-secondary-fixed-dim transition-colors opacity-80" href="#">&gt; FORGOT?</a>
</label>
<div class="relative">
<input autocomplete="current-password" class="input-tech w-full py-sm pl-sm pr-10 font-technical-sm text-technical-sm" id="password" placeholder="Enter encrypted passkey..." required="" type="password"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 text-secondary-container opacity-50 hover:opacity-100 transition-opacity focus:outline-none" id="togglePassword" type="button">

</button>

</div>
<!-- Submit Button -->

<p class="font-technical-sm text-technical-sm text-secondary-fixed flex items-center gap-xs">
<span class="material-symbols-outlined" style="font-size: 14px;">encrypted</span>
                SECURE AUTHENTICATION // AES-256
            </p>
<div class="flex gap-1">
<div class="w-4 h-1 bg-secondary-fixed opacity-100"></div>
<div class="w-4 h-1 bg-secondary-fixed opacity-60"></div>
<div class="w-4 h-1 bg-secondary-fixed opacity-30"></div>
<div class="w-4 h-1 bg-surface-variant"></div>
<div class="w-4 h-1 bg-surface-variant"></div>
</div>
<p class="font-technical-sm text-technical-sm text-on-surface-variant" style="font-size: 10px;">SYS_VER: 4.2.0.9 // NODE: ALPHA</p>
</div>
</div>
<script>
        // Password Visibility Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibilityIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            
            // Add a brief glitch effect to icon
            visibilityIcon.style.opacity = '0.5';
            setTimeout(() => {
                visibilityIcon.style.opacity = '1';
            }, 100);
        });

        // Input Focus Effects (Simulating terminal typing readiness)
        const inputs = document.querySelectorAll('.input-tech');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                const label = input.closest('div.flex-col').querySelector('label span:first-child');
                label.style.color = '#00F3FF';
                label.style.textShadow = '0 0 5px rgba(0, 243, 255, 0.5)';
            });
            input.addEventListener('blur', () => {
                const label = input.closest('div.flex-col').querySelector('label span:first-child');
                label.style.color = '';
                label.style.textShadow = '';
            });
        });
    </script>
